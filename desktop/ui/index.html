<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delivery System</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --ink:#1a1c22; --faint:#6b6f7a; --accent:#3b45a8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --ink:#e8e9ec; --faint:#9096a3; --accent:#8e96f0; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "IBM Plex Sans", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 0 24px; }
  .mark { width: 44px; height: 44px; color: var(--accent); }
  .name { font-weight: 600; font-size: 17px; }
  .status { color: var(--faint); font-size: 13px; min-height: 1.5em; }
  .dots::after { content: "…"; animation: dots 1.4s steps(4, end) infinite; display: inline-block; width: 1.2em; text-align: left; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .err { color: #b3402f; white-space: pre-wrap; font: 12px/1.4 ui-monospace, "IBM Plex Mono", monospace; max-width: 60ch; text-align: left; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<div class="box">
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="2.2"/><path d="M8 15.5c2.5-6 6.5-8 10-4.5"/><circle cx="18" cy="9" r="2.2"/><path d="m14.5 18 2 2 4-4"/></svg>
  <div class="name">Delivery System</div>
  <div class="status dots" id="status">Starting the local service</div>
  <div class="err" id="err" hidden></div>
</div>
<script>
  // The Rust launcher calls window.__gtdStatus(text) while it probes /api/health, then navigates the
  // webview to the sidecar's URL. If the sidecar dies before health answers, it calls window.__gtdError(text).
  window.__gtdStatus = (t) => { document.getElementById('status').textContent = t; };
  window.__gtdError = (t) => { const s = document.getElementById('status'); s.classList.remove('dots'); s.textContent = 'The local service did not start.'; const e = document.getElementById('err'); e.textContent = t; e.hidden = false; };
</script>
</body>
</html>
