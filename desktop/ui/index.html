<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snowball</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --ink:#1a1c22; --faint:#6b6f7a; --accent:#3b45a8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --ink:#e8e9ec; --faint:#9096a3; --accent:#8e96f0; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "IBM Plex Sans", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 0 24px; }
  .mark { width: 44px; height: 44px; color: var(--accent); }
  .name { font-weight: 600; font-size: 17px; }
  .status { color: var(--faint); font-size: 13px; min-height: 1.5em; }
  .dots::after { content: "…"; animation: dots 1.4s steps(4, end) infinite; display: inline-block; width: 1.2em; text-align: left; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .err { color: #b3402f; white-space: pre-wrap; font: 12px/1.4 ui-monospace, "IBM Plex Mono", monospace; max-width: 60ch; text-align: left; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<div class="box">
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><g stroke-width="1.5"><path d="M8.6 8.1v4.2M6.78 9.15l3.64 2.1M6.78 11.25l3.64 -2.1"/><path d="M14.8 7.3v3.4M13.33 8.15l2.94 1.7M13.33 9.85l2.94 -1.7"/><path d="M13 13.1v4.2M11.18 14.15l3.64 2.1M11.18 16.25l3.64 -2.1"/></g></svg>
  <div class="name">Snowball</div>
  <div class="status dots" id="status">Starting the local service</div>
  <div class="err" id="err" hidden></div>
</div>
<script>
  // The Rust launcher calls window.__snowStatus(text) while it probes /api/health, then navigates the
  // webview to the sidecar's URL. If the sidecar dies before health answers, it calls window.__snowError(text).
  window.__snowStatus = (t) => { document.getElementById('status').textContent = t; };
  window.__snowError = (t) => { const s = document.getElementById('status'); s.classList.remove('dots'); s.textContent = 'The local service did not start.'; const e = document.getElementById('err'); e.textContent = t; e.hidden = false; };
</script>
</body>
</html>
