<meta charset="utf-8">
<title>Commitment Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f4f5f8; --surface:#ffffff; --surface-2:#eceef3; --raised:#ffffff;
  --ink:#171a21; --ink-2:#565d6b; --ink-3:#8b919e; --line:#dfe2e9; --line-2:#c9cdd6;
  --accent:#3b45a8; --accent-ink:#ffffff; --accent-soft:#e8eafb; --accent-text:#2f388a;
  --good:#1e8a4c; --good-soft:#e3f3e9; --warn:#b8720c; --warn-soft:#fbf0dc; --crit:#c53a3a; --crit-soft:#fbe5e5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --o1:#86b6ef; --o2:#5598e7; --o3:#2a78d6; --o4:#184f95;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c0:#888780;
  --shadow:0 12px 32px rgba(23,26,33,.14);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0f1216; --surface:#171b22; --surface-2:#1e232c; --raised:#1c212a;
    --ink:#e7e9ef; --ink-2:#a4aab7; --ink-3:#6f7686; --line:#262b35; --line-2:#333a47;
    --accent:#8e96f0; --accent-ink:#0f1216; --accent-soft:#232848; --accent-text:#b3b9f5;
    --good:#3fb46f; --good-soft:#15291d; --warn:#e09a2b; --warn-soft:#2e2311; --crit:#e5615f; --crit-soft:#331717;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --o1:#9ec5f4; --o2:#6da7ec; --o3:#3987e5; --o4:#256abf;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c0:#888780;
    --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f1216; --surface:#171b22; --surface-2:#1e232c; --raised:#1c212a;
  --ink:#e7e9ef; --ink-2:#a4aab7; --ink-3:#6f7686; --line:#262b35; --line-2:#333a47;
  --accent:#8e96f0; --accent-ink:#0f1216; --accent-soft:#232848; --accent-text:#b3b9f5;
  --good:#3fb46f; --good-soft:#15291d; --warn:#e09a2b; --warn-soft:#2e2311; --crit:#e5615f; --crit-soft:#331717;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --o1:#9ec5f4; --o2:#6da7ec; --o3:#3987e5; --o4:#256abf;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c0:#888780;
  --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2} h2{font-size:17px;line-height:1.3} h3{font-size:14px;line-height:1.3}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px}
.brand .name{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1}
.brand .sub{font-size:11px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .group{padding:12px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-text)}
.nav a .key{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.ico{width:17px;height:17px;flex:none;color:var(--ink-3)}
.nav a:hover .ico{color:var(--ink-2)} .nav a.on .ico{color:var(--accent-text)}
.vhead h1{display:flex;align-items:center;gap:10px}
.h1ico{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);display:inline-grid;place-items:center;flex:none}
.h1ico .ico{width:18px;height:18px;color:var(--accent-text)}
.iconbtn{display:inline-flex;align-items:center;gap:6px} .iconbtn .ico{width:15px;height:15px;color:currentColor}
.guide{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.guide .gi{width:26px;height:26px;border-radius:7px;background:var(--surface);display:grid;place-items:center} .guide .gi .ico{color:var(--accent-text)}
.guide .gh{display:flex;gap:6px;align-items:baseline;color:var(--accent-text)} .guide .gh b{font-weight:600}
.guide p{margin:3px 0 0;max-width:90ch;line-height:1.55}
.guide .kbd,.guide .chip{vertical-align:middle}
.steps-l{margin:0;padding-left:20px;color:var(--ink-2)} .steps-l li{margin:4px 0}
.nav a .cnt{margin-left:auto;min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.nav a.on .cnt{background:var(--accent);color:var(--accent-ink)}
.nav a .cnt.hot{background:var(--crit-soft);color:var(--crit)}
.nav a .cnt.ai{background:var(--accent-soft);color:var(--accent-text)}
.health .ai b{color:var(--accent-text)}
.lab{display:flex;gap:12px;flex:1;min-width:0;cursor:pointer}
.t.clickable{cursor:pointer;border-radius:6px;margin:-4px -6px;padding:4px 6px} .t.clickable:hover{background:var(--surface-2)}
.chip.aichip{background:var(--accent-soft);color:var(--accent-text)}
.aican{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
.aican .dlg{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;cursor:pointer}
.effect{font-size:12px;color:var(--ink-2)} .effect b{color:var(--ink);font-weight:500}
.panel.ready{border-color:var(--accent)}
.tile.ai .v{color:var(--accent-text)}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){.lanes{grid-template-columns:1fr}}
.lane{display:flex;flex-direction:column;gap:10px}
.lane .lh{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
.lane .lh h2{font-size:14px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dcard.ready{border-color:var(--accent)}
.dcard.queued{border-style:dashed}
.preview{font-size:12.5px;color:var(--ink-2);white-space:pre-line;max-height:4.2em;overflow:hidden;border-left:2px solid var(--line-2);padding-left:10px}
.pbar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.wstatus{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--ground)}
.wstatus p{margin:0;max-width:78ch;color:var(--ink-2);font-size:13px}
.wlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wlinks a.chip{text-decoration:none;color:var(--accent-text);background:var(--accent-soft)}
.wrow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.wrow:first-of-type{border-top:0}
table.mini td{padding:5px 8px;font-size:12.5px}
.pcard.aicard{border-color:var(--accent)} .pcard.aicard .av{background:var(--accent);color:var(--accent-ink)}
.rail .foot{margin-top:auto;padding:0 8px;font-size:11px;color:var(--ink-3);line-height:1.6}

main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.capture{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 12px}
.capture:focus-within{border-color:var(--accent)}
.capture input{flex:1;border:0;background:transparent;outline:0;min-width:0}
.capture .hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.health{display:flex;gap:18px;margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.health b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.health .bad b{color:var(--crit)}
.date{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}

.view{padding:24px 28px 60px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vhead p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel > .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel > .ph h2{font-size:15px}
.panel .pb{padding:6px 0}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t .m{font-size:12px;color:var(--ink-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.row.done .t{text-decoration:line-through;color:var(--ink-3)}
.chk{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:4px;margin-top:3px;flex:none;display:grid;place-items:center;background:var(--surface)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:8px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ctx{font-family:var(--mono);font-size:11px}
.chip.proj{--pc:var(--c0);color:var(--ink);background:color-mix(in srgb, var(--pc) 13%, var(--surface));padding-left:6px}
.chip.proj::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--pc);flex:none}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc,var(--c0));margin-right:8px;vertical-align:1px}
.prog{border-top:3px solid var(--pc,var(--line))}
.chip.src{background:transparent;border:1px solid var(--line);color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.age{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.age.over{color:var(--crit);font-weight:500}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.kbd{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;color:var(--ink-2);line-height:16px;background:var(--surface)}

.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12.5px;color:var(--ink-2)}
.tile.crit{border-color:var(--crit);border-width:1px}
.tile.crit .v{color:var(--crit)}
.tile.warn .v{color:var(--warn)}
.tile .spark{margin-top:6px;height:26px}

.agenda{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start}
.slot:last-child{border-bottom:0}
.slot .tm{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-top:2px;font-variant-numeric:tabular-nums}
.slot.now .tm{color:var(--accent-text);font-weight:500}
.slot .who{font-size:12px;color:var(--ink-2);margin-top:2px}
.ctxgroup{padding:10px 16px 4px;display:flex;align-items:center;gap:8px}
.ctxgroup .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

.inbox{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
@media (max-width:1000px){.inbox{grid-template-columns:1fr}}
.ilist .row{cursor:pointer;gap:10px}
.ilist .row:hover{background:var(--surface-2)}
.ilist .row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ilist .raw{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilist .row.sel .raw{white-space:normal}
.conf{width:36px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:none;margin-top:8px}
.conf i{display:block;height:100%;background:var(--good)}
.conf.low i{background:var(--warn)}
.detail{position:sticky;top:78px}
.detail .src{padding:14px 18px;border-bottom:1px solid var(--line)}
.detail .src .raw{font-size:15px;line-height:1.5;margin-top:6px}
.detail .prop{padding:14px 18px;display:grid;grid-template-columns:110px 1fr;gap:10px 14px;align-items:center}
.detail .prop label{font-size:12px;color:var(--ink-2);font-weight:500}
.detail .prop input,.detail .prop select{width:100%;border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:6px 9px}
.detail .prop input:focus,.detail .prop select:focus{border-color:var(--accent);outline:0}
.kindgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:1000px){.kindgrid{grid-template-columns:1fr}}
.kg{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--ground)}
.kgh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:0 4px 4px}
.kg button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 9px;color:var(--ink-2)}
.kg button b{font-weight:500;color:var(--ink);font-size:13px} .kg button span{font-size:11.5px;color:var(--ink-3)}
.kg button:hover{background:var(--surface);border-color:var(--line-2)}
.kg button.on{background:var(--accent-soft);border-color:var(--accent)} .kg button.on b,.kg button.on span{color:var(--accent-text)}
.rationale{padding:0 18px 14px;font-size:12.5px;color:var(--ink-2)}
.rationale .why{background:var(--ground);border-radius:7px;padding:9px 12px;border-left:3px solid var(--line-2)}
.rationale .why.low{border-left-color:var(--warn)}
.acts{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.acts .sp{flex:1}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:4px}

.prog{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prog .head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prog .head h2{white-space:nowrap}
.prog .head .purpose{color:var(--ink-2);font-size:13px;flex:1 1 280px;min-width:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:8px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.flag{font-size:11.5px;font-weight:600;color:var(--crit)}
.tablewrap{overflow-x:auto}
.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:500;text-align:left;cursor:pointer}
.linkish:hover{color:var(--accent-text);text-decoration:underline}
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hist li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.drawer .sec p{max-width:60ch}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:500;color:var(--ink-2)}
.in{width:100%;border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:8px 10px;font:inherit;resize:vertical}
.in:focus{border-color:var(--accent);outline:0}

.aging{display:flex;flex-direction:column;gap:6px;padding:14px 18px}
.aging .bar{display:grid;grid-template-columns:70px 1fr 28px;align-items:center;gap:10px;font-size:12.5px}
.aging .bar .lbl{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.aging .bar .trk{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.aging .bar .trk i{display:block;height:100%;border-radius:0 4px 4px 0}
.aging .bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;padding:10px 12px;overflow-x:auto}
.cal-col{min-width:0;display:flex;flex-direction:column;gap:4px;padding:6px 4px;border-radius:6px;min-height:84px}

    <div class="tablewrap"><table><thead><tr><th>Project</th><th>Health</th><th>Next action</th><th>Last movement</th><th>Flags</th></tr></thead><tbody>

      return `<tr><td><button class="linkish" data-proj="${j.id}">${esc(j.name)}</button><div class="sub">${esc(j.outcome)}</div></td><td>${healthPill(j.health)}</td>
      <td>${s.na ? esc(s.na.next) + `<div class="sub"><span class="chip ctx">${esc(s.na.ctx)}</span>${n > 1 ? ` <span class="faint">+${n - 1} more open</span>` : ''}</div>` : s.dl ? `<span class="muted">Delegated to AI</span><div class="sub">${esc(s.dl.next)} · ${s.dl.del.status === 'ready' ? '<b>ready for review</b>' : s.dl.del.status}</div>` : s.w ? `<span class="muted">Waiting on ${esc(pname(s.w.owner))}</span><div class="sub">${esc(s.w.next)}</div>` : `<button class="btn sm" data-proj="${j.id}">Decide next action</button>`}</td>
      <td class="num"><span class="age ${s.stalled ? 'over' : ''}">${s.lm ? s.age + 'd' : '—'}</span>${s.lm ? `<div class="sub">${esc(s.lm.what)}</div>` : '<div class="sub">No activity</div>'}</td><td>${[s.stalled ? '<span class="flag">Stalled</span>' : '', s.noNext ? '<span class="flag">No next action</span>' : ''].filter(Boolean).join('<br>') || '<span class="faint">—</span>'}</td></tr>`; }).join('') || `<tr><td colspan="5" class="muted">No projects yet.</td></tr>`}
    </tbody></table></div></div>`; }).join('')}
  ${programs.some(g => g.retired) ? `<div class="panel"><div class="ph"><h2>Retired</h2><span class="note">Purpose met or superseded. Wiki pages kept as history.</span></div><div class="pb">${programs.filter(g => g.retired).map(g => `<div class="row"><div class="t"><div class="muted">${esc(g.name)}</div><div class="m"><span class="faint">retired ${fmtDate(g.retired)}</span><span class="chip mono">wiki/${esc(wiki[g.id]?.page || '')}.md</span></div></div><button class="btn sm ghost" data-wiki="${g.id}">Wiki</button></div>`).join('')}</div></div>` : ''}`;

function viewWaiting() {
  const ws = by('waiting');
  const buckets = [['0–7 d', w => days(w.since) <= 7, 'var(--o1)'], ['8–14 d', w => days(w.since) > 7 && days(w.since) <= 14, 'var(--o2)'], ['15–30 d', w => days(w.since) > 14 && days(w.since) <= 30, 'var(--o3)'], ['30+ d', w => days(w.since) > 30, 'var(--o4)']];
  const max = Math.max(1, ...buckets.map(b => ws.filter(b[1]).length));
  const byPerson = {};
  for (const w of ws) (byPerson[w.owner] ||= []).push(w);
  const ppl = Object.keys(byPerson).sort((a, b) => Math.max(...byPerson[b].map(w => days(w.since))) - Math.max(...byPerson[a].map(w => days(w.since))));
  return `<div class="vhead"><div><h1>Waiting for</h1><p>The ledger of what's owed to you. Aged like receivables; nudges are drafted by AI and sent only when you approve.</p></div></div>
  ${(() => { const overdue = ws.filter(w => until(w.followUp) < 0); const daysAhead = [...Array(14)].map((_, i) => d(i)); const later = ws.filter(w => until(w.followUp) >= 14);
    const cell = (list, cls) => list.map(w => `<button class="cal-item ${cls}" data-nudge="${w.id}" title="${esc(w.next)} — draft nudge">${esc(pname(w.owner))}<span>${esc(w.next)}</span></button>`).join('');
    return `<div class="panel"><div class="ph"><h2>Follow-ups, next 14 days</h2><span class="note">When you'll be chasing whom — follow-up dates are ticklers, not appointments. Click one to draft the nudge.</span></div>
    <div class="cal"><div class="cal-col over"><div class="cal-h"><b>Overdue</b><span>${overdue.length}</span></div>${cell(overdue, 'over')}</div>
    ${daysAhead.map((day, i) => { const list = ws.filter(w => until(w.followUp) === i); const dow = day.getDay(), wk = dow === 0 || dow === 6; return `<div class="cal-col ${i === 0 ? 'today' : ''} ${wk ? 'wk' : ''}"><div class="cal-h"><b>${i === 0 ? 'Today' : day.toLocaleDateString('en-GB', { weekday:'short' })}</b><span>${day.getDate()}</span></div>${cell(list, '')}</div>`; }).join('')}
    <div class="cal-col later"><div class="cal-h"><b>Later</b><span>${later.length}</span></div>${cell(later, '')}</div></div></div>`; })()}
  <div class="cols">
    <div class="panel"><div class="ph"><h2>Aging</h2><span class="note num">${ws.length} open · ${ws.filter(w => until(w.followUp) < 0).length} past follow-up</span></div>
      <div class="aging">${buckets.map(b => { const n = ws.filter(b[1]).length; return `<div class="bar"><span class="lbl">${b[0]}</span><div class="trk"><i style="width:${n / max * 100}%;background:${b[2]}"></i></div><span class="n">${n}</span></div>`; }).join('')}</div>
      <div class="ph" style="border-top:1px solid var(--line);border-bottom:0"><h2>Oldest</h2></div>
      <div class="pb">${[...ws].sort((a, b) => days(b.since) - days(a.since)).slice(0, 3).map(w => `<div class="row"><div class="t"><div>${esc(w.next)}</div><div class="m"><span class="chip">${esc(pname(w.owner))}</span><span class="age over">${days(w.since)}d</span></div></div></div>`).join('')}</div>
    </div>
    <div class="panel"><div class="ph"><h2>By person</h2><span class="note">Sorted by oldest item</span></div>
      <div class="pb">${ppl.map(pid => `<div class="person-h"><span class="av">${initials(pid)}</span><b>${esc(person(pid).name)}</b><span class="note">${esc(person(pid).role)}</span></div>${byPerson[pid].map(w => waitingRow(w)).join('')}`).join('')}</div>
    </div>
  </div>`;
}

  <div class="panel"><div class="ph"><h2>Parked</h2><span class="note">Sorted by revisit date</span></div><div class="pb">${some.map(x => `<div class="row"><div class="t"><div>${esc(x.next)}</div><div class="m">${x.project ? `${projChip(x.project)}` : ''}<span class="age">${days(x.since)}d parked</span>${x.revisit ? `<span class="chip" style="color:var(--accent-text);background:var(--accent-soft)">↺ revisit ${dueLabel(x.revisit)}</span>` : '<span class="faint">no revisit date</span>'}</div></div><input type="date" class="in" style="width:auto;padding:4px 8px" value="${x.revisit ? iso(x.revisit) : ''}" data-revisit="${x.id}" title="Revisit on"><button class="btn sm" data-promote="${x.id}">Promote</button><button class="btn sm ghost" data-drop="${x.id}">Drop</button></div>`).join('') || '<div class="empty">Nothing parked.</div>'}</div></div>`;

function viewReview() {
  const inbox = by('inbox').length, noNext = projects.filter(p => !p.dropped && !programs.find(g => g.id === p.program)?.retired && projHealth(p).noNext), aged = by('waiting').filter(w => days(w.since) > 14), some = by('someday'), done = by('done');
  const steps = [
    { id:'inbox', title:'Get the inbox to zero', auto: inbox === 0, status: inbox ? `${inbox} left` : 'Empty', body: inbox ? `<div class="row"><div class="t">${inbox} item${inbox > 1 ? 's' : ''} still need a decision.</div><a class="btn sm" href="#inbox">Open inbox</a></div>` : `<div class="row"><div class="t muted">Nothing unclarified. Good.</div></div>` },
    { id:'sweep', title:'Mind sweep — empty your head', status: `${items.filter(i => i.source === 'sweep' && i.captured && days(i.captured) === 0).length} captured today`, body: `<div class="row"><div class="t"><div class="muted" style="margin-bottom:6px">Walk the triggers; capture anything that surfaces. Don't clarify yet — that's the inbox's job.</div><div class="trig">${sweepTriggers.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div></div><div class="row"><form class="capture" data-sweepform style="max-width:none;flex:1"><span class="faint">+</span><input placeholder="What's on your mind?" aria-label="Mind sweep capture"><span class="hint">⏎</span></form></div>` },
    { id:'pastcal', title:'Sweep last week\'s calendar', status: `${pastMeetings.filter(m => !m.captured).length} meetings with nothing captured`, body: pastMeetings.map(m => `<div class="row"><div class="t"><div>${esc(m.title)}</div><div class="m"><span class="faint">${fmtDate(m.on)} · ${m.who.map(pname).join(', ')}</span>${m.captured ? `<span class="chip">${m.captured} captured</span>` : '<span class="flag">nothing captured</span>'}</div></div>${m.captured ? '' : `<button class="btn sm" data-capfrom="${esc(m.title)}">Capture follow-ups</button>`}</div>`).join('') + `<div class="row"><div class="t muted">A meeting with no captured items usually means loose ends in your head, not a meeting with none.</div></div>` },
    { id:'upcoming', title:'Preview the next two weeks', status: `${calendarAhead.length + mine().filter(a => a.hard && until(a.hard) > 0 && until(a.hard) <= 14).length} on the calendar`, body: [...calendarAhead.map(c => ({ on:c.on, txt:`${c.time} ${c.title}`, sub:c.who.map(pname).join(', '), mtg:true })), ...mine().filter(a => a.hard && until(a.hard) > 0 && until(a.hard) <= 14).map(a => ({ on:a.hard, txt:a.next, sub:projName(a.project), mtg:false }))].sort((a, b) => a.on - b.on).map(e => `<div class="row"><div class="t"><div>${esc(e.txt)}${e.mtg ? '' : ' <span class="chip" style="color:var(--warn);background:var(--warn-soft)">day-specific action</span>'}</div><div class="m"><span class="faint">${fmtDate(e.on)} · ${esc(e.sub)}</span></div></div>${e.mtg ? `<button class="btn sm ghost" data-capprep="${esc(e.txt.replace(/^\d\d:\d\d /, ''))}|${iso(e.on)}">Capture prep</button>` : ''}</div>`).join('') + `<div class="row"><div class="t"><div class="muted" style="margin-bottom:6px">Anything here that needs prep you haven't got a next action for? Capture it now — it goes to the inbox to clarify.</div><form class="capture" data-sweepform="calendar" style="max-width:none"><span class="faint">+</span><input placeholder="e.g. Pull savings numbers before board prep with Ingrid" aria-label="Capture prep"><span class="hint">⏎</span></form></div></div>` },
    { id:'next', title:'Every project has a next action', auto: noNext.length === 0, status: noNext.length ? `${noNext.length} missing` : 'All covered', body: noNext.map(p => `<div class="row"><div class="t"><div>${esc(p.name)}</div><div class="m">${projChip(p.program)}<span class="age over">${projHealth(p).lm ? projHealth(p).age + 'd since movement' : 'no activity'}</span></div></div><button class="btn sm" data-proj="${p.id}">Decide next action</button></div>`).join('') || `<div class="row"><div class="t muted">Every active project has an action or a waiting-for.</div></div>` },
    { id:'waiting', title:'Review waiting-fors older than 14 days', status: `${aged.length} aged`, body: aged.map(w => waitingRow(w, { showOwner:true })).join('') },
    { id:'someday', title:'Someday / maybe: promote or drop', status: `${some.length} parked`, body: some.map(s => `<div class="row"><div class="t"><div>${esc(s.next)}</div><div class="m"><span class="age">${days(s.since)}d parked</span></div></div><button class="btn sm" data-promote="${s.id}">Promote</button><button class="btn sm ghost" data-drop="${s.id}">Drop</button></div>`).join('') },
    { id:'wins', title:'Wins this week → status draft', status: `${done.length} done`, body: done.map(x => `<div class="row"><div class="t"><div>${esc(x.next)}</div><div class="m">${projChip(x.project)}<span class="faint">${fmtDate(x.doneAt || TODAY)}</span></div></div></div>`).join('') + `<div class="row"><div class="t muted">These become the "done" section of Friday's status.</div><button class="btn sm" data-status>Draft status report</button></div>` },
    { id:'ai', title:'Audit what the AI did this week', status: `${aiLog.length} runs · ${items.filter(i => i.del?.status === 'approved').length + 3} approved`, body: aiLog.map(l => `<div class="row"><div class="t"><div>${esc(l.what)}</div><div class="m"><span class="chip ${l.mode === 'auto' ? 'aichip' : ''}">${l.mode === 'auto' ? 'automatic' : 'you approved'}</span><span class="faint">${fmtDate(l.at)}</span></div></div></div>`).join('') + `<div class="row"><div class="t muted">Automatic actions are the ones to eyeball: if any look wrong, lower that capability's autonomy.</div><a class="btn sm" href="#delegated">Autonomy settings</a></div>` },
    { id:'lint', title:'Wiki lint', status: `${wikiLint.length} findings`, body: wikiLint.map(l => `<div class="row"><div class="t"><div>${esc(l.what)}</div><div class="m"><span class="chip mono">${esc(l.page)}.md</span><span class="faint">${esc(l.fix)}</span></div></div></div>`).join('') + `<div class="row"><div class="t muted">Stale compiled sections, wiki–ledger contradictions, orphan pages. Fixes go through a reviewed ingest.</div></div>` },
    { id:'horizons', title:'Look up: programs still serve their purpose?', status: `${active().length} programs`, body: active().map(g => `<div class="row"><div class="t"><div>${esc(g.name)}</div><div class="m muted">${esc(g.purpose)}</div><div class="m"><span class="faint num">${activeProjects(g.id).length} projects · sponsor ${esc(pname(g.sponsor))}</span></div></div><button class="btn sm ghost" data-retire="${g.id}">Retire</button></div>`).join('') + `<div class="row"><div class="t muted">A program is an area of responsibility: rare, deliberate, with a purpose you can check projects against. Add one here or from Programs; retire one when its purpose is met.</div><button class="btn sm" data-addprog>Add program</button></div>` },
  ];

    inbox: 'Get clear. Nothing else in the review is trustworthy while unclarified items are sitting here — an unprocessed inbox is a list of decisions you haven\'t made yet. Empty it first, then review.',
    sweep: 'Get clear. Anything still in your head is not in the system, and GTD only works if the system holds everything. Walk the triggers and write down whatever surfaces, without judging or clarifying it — capture now, decide later in the inbox.',
    pastcal: 'Get current. Meetings generate commitments that rarely get written down in the moment. A meeting with nothing captured usually means loose ends in your head, not a meeting with none — look at each and capture what you promised or were promised.',
    upcoming: 'Get current. Look two weeks ahead so nothing arrives unprepared. Anything that needs prep and doesn\'t yet have a next action is a gap — capture it here and clarify it in the inbox.',
    next: 'Get current. The projects list only moves if every project has a next physical action or a waiting-for. A project without one is stalled, however healthy it looks — decide the action now, or park or drop the project honestly.',
    waiting: 'Get current. What\'s owed to you drives your programs more than your own list does. For each aged item ask: still needed? If yes, nudge or escalate; if no, drop it. Don\'t let a waiting-for quietly become a wish.',
    someday: 'Get creative. Someday / maybe is where ideas incubate without cluttering the action lists — but only if you actually look at them. Promote what\'s ready, give a revisit date to what isn\'t, drop what no longer interests you.',
    wins: 'Get current. Completed items are the evidence for status reporting, and they\'re also how you calibrate: if this list is short, either the week was interrupt-driven or the next actions were too big. The draft status report assembles from here plus health and waiting-fors.',
    ai: 'Trust check. Everything the assistant did this week is listed; automatic actions are the ones to eyeball. If something looks wrong, lower that capability\'s autonomy — the settings exist so trust can be adjusted one capability at a time.',
    lint: 'Get current, for the wiki. Compiled status sections go stale, the wiki and the ledger can disagree, pages can go orphaned. Fix findings through a reviewed ingest so the context you rely on for prep briefs stays true.',
    horizons: 'Look up. Programs are areas of responsibility; each has a purpose you can check projects against. Ask: does every project still serve its program\'s purpose? Is there work with no home? Has a program met its purpose and earned retirement?',
  };
  const doneCount = steps.filter(s => s.auto || state.review[s.id]).length;
  return `<div class="vhead"><div><h1>Weekly review</h1><p>AI prepared the evidence; the decisions are yours. Last completed ${days(state.lastReview)} days ago.</p></div><div style="display:flex;align-items:center;gap:12px;min-width:260px"><div class="progress"><i style="width:${doneCount / steps.length * 100}%"></i></div><span class="note num">${doneCount}/${steps.length}</span></div></div>
  <div class="steps">${steps.map((s, i) => { const ok = s.auto || !!state.review[s.id]; return `<div class="step ${ok ? 'ok' : ''}"><div class="sh"><input class="chk" type="checkbox" data-step="${s.id}" ${ok ? 'checked' : ''} ${s.auto ? 'disabled' : ''}><span class="n">${i + 1}</span><h3>${s.title}</h3><span class="st">${s.status}</span></div>${why[s.id] ? `<div class="swhy">${why[s.id]}</div>` : ''}<div class="sb">${s.body}</div></div>`; }).join('')}</div>
  <div class="acts" style="border:0;padding:0"><span class="note">Completing the review stamps <code class="mono">last_reviewed</code> on every project and resets the health strip.</span><span class="sp"></span><button class="btn primary" data-complete ${doneCount < steps.length ? 'disabled' : ''}>Complete review</button></div>`;
}

function viewFlow() {
  const W = 720, H = 220, padL = 32, padB = 26, padT = 10, gw = (W - padL - 8) / flowWeeks.length, bw = Math.floor((gw - 14) / 3), maxV = 45;
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);
  const series = [['c', 'Captured', 'var(--s1)'], ['k', 'Clarified', 'var(--s2)'], ['d', 'Done', 'var(--s3)']];
  const bars = flowWeeks.map((wk, i) => series.map((s, j) => { const x = padL + i * gw + 7 + j * (bw + 2), h = H - padB - y(wk[s[0]]);
    return `<rect x="${x}" y="${y(wk[s[0]])}" width="${bw}" height="${h}" rx="3" fill="${s[2]}" data-tip="<b>${s[1]}</b> · week of ${wk.w}: ${wk[s[0]]}"></rect>`; }).join('')).join('');
  const ticks = [0, 15, 30, 45].map(v => `<line x1="${padL}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}"></line><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
  const labels = flowWeeks.map((wk, i) => `<text x="${padL + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${wk.w}</text>`).join('');
  const streak = 4;
  return `<div class="vhead"><div><h1>Flow</h1><p>Is the system itself healthy? Capture must be clarified within a day, and done should track captured — a widening gap means the lists are filling faster than you close them.</p></div><button class="btn ghost" data-reset>Reset demo data</button></div>
  <div class="attn">

  }
  else if (ds.primary) { const a = items.find(i => i.id === ds.primary); state.primary[a.project] = a.id; save(); toast('Marked as the next action for ' + projName(a.project)); projectDrawer(a.project); render(); }
  else if (ds.addnext) { const j = projOf(ds.addnext); const next = $('#suggestText')?.value.trim(); if (!next) { $('#suggestErr').textContent = 'Write the next physical action first.'; return; } const id = 'N' + Date.now(); const n = { id, kind:'action', next, project:j.id, ctx:$('#suggestCtx')?.value || '@deep', min:30, createdAt:TODAY }; items.push(n); state.captured.push(Object.assign({}, n, { createdAt:iso(TODAY) })); state.primary[j.id] = id; save(); toast('Next action added · tagged ai-suggested, confirmed by you'); projectDrawer(j.id); render(); }
  else if (ds.promote) { const s = items.find(i => i.id === ds.promote); s.kind = 'action'; s.ctx = '@deep'; s.min = 30; s.createdAt = TODAY; state.kinds[s.id] = 'action'; state.overrides[s.id] = { ctx:'@deep', min:30, createdAt:TODAY }; save(); toast('Promoted to next action'); render(); }
  else if (ds.drop) { const s = items.find(i => i.id === ds.drop); s.kind = 'trash'; state.kinds[s.id] = 'trash'; save(); toast('Dropped'); render(); }
  else if ('status' in ds) statusDraft();
  else if ('complete' in ds) { state.lastReview = iso(TODAY); state.review = {}; save(); toast('Weekly review completed · every project stamped'); render(); }
  else if ('copy' in ds) { const ta = $('#drawer textarea'); ta?.select(); try { navigator.clipboard?.writeText(ta.value); } catch (x) {} toast('Copied'); }
  else if ('reset' in ds) { try { localStorage.removeItem(STORE); } catch (x) {} location.reload(); }
});
document.addEventListener('input', (e) => { if (e.target.closest('.form')) { const er = $('#npErr'); if (er) er.textContent = ''; } });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.done) { const it = items.find(i => i.id === t.dataset.done); if (t.checked) { it._prev = it.kind; it.kind = 'done'; it.doneAt = TODAY; state.done[it.id] = true; state.overrides[it.id] = Object.assign(state.overrides[it.id] || {}, { doneAt:TODAY }); toast('Done · logged for the weekly review'); } else { it.kind = it._prev || 'action'; delete state.done[it.id]; } save(); renderNav(); }
  if (t.dataset.step) { state.review[t.dataset.step] = t.checked; save(); render(); }
  if (t.dataset.moveproj && t.value) { const j = projOf(t.dataset.moveproj); const from = j.program; j.program = t.value; state.projOverrides[j.id] = Object.assign(state.projOverrides[j.id] || {}, { program:t.value }); save(); toast(`Moved "${j.name}" to ${projName(t.value)}`); retireDrawer(from); render(); }
  if (t.dataset.revisit) { const x = items.find(i => i.id === t.dataset.revisit); x.revisit = t.value ? new Date(t.value + 'T08:00:00') : null; state.overrides[x.id] = Object.assign(state.overrides[x.id] || {}, { revisit:x.revisit }); save(); toast(x.revisit ? `Will resurface ${fmtDate(x.revisit)}` : 'Revisit date cleared'); renderNav(); }
  if ('fscope' in t.dataset) { nowScope = t.value; render(); }
  if (t.dataset.setdate) { const x = items.find(i => i.id === t.dataset.id); const v = t.value ? new Date(t.value + 'T08:00:00') : null; x[t.dataset.setdate] = v; state.overrides[x.id] = Object.assign(state.overrides[x.id] || {}, { [t.dataset.setdate]: v }); save(); toast(v ? `${t.dataset.setdate === 'followUp' ? 'Follow-up' : t.dataset.setdate === 'hard' ? 'Pinned to' : 'Due'} ${fmtDate(v)}` : 'Date cleared'); render(); }
  if (t.dataset.autonomy) { state.autonomy[t.dataset.autonomy] = t.value; save(); toast(`${capLabel[t.dataset.autonomy]}: ${autonomyLabel[t.value]}`); }
});
$('#drawerBg').addEventListener('click', closeDrawer);
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-sweepform]'); if (!f) return; e.preventDefault();
  const v = f.querySelector('input').value.trim(); if (!v) return;
  const src = f.dataset.sweepform || 'sweep';
  const id = 'C' + Date.now(); const n = { id, kind:'inbox', source:src, from:null, captured:TODAY, raw:v, p:{ kind:'action', next:v, project:null, ctx:'@quick', min:15, conf:.6, why: src === 'calendar' ? 'Captured from the two-week preview — prep for something on the calendar.' : 'From the mind sweep — clarify in the inbox.' } };
  items.unshift(n); state.captured.push(Object.assign({}, n, { captured:iso(TODAY) })); save(); f.querySelector('input').value = ''; toast(src === 'calendar' ? 'Captured — clarify it in the inbox' : 'Captured — keep sweeping'); render(); $(`[data-sweepform="${src === 'sweep' ? '' : src}"] input`)?.focus();
});
$('#captureForm').addEventListener('submit', (e) => {
  e.preventDefault(); const v = $('#captureInput').value.trim(); if (!v) return;
  const id = 'C' + Date.now();
  const guessWait = /waiting|will send|said (he|she|they)|promised|get back/i.test(v), guessSome = /idea|someday|maybe|could/i.test(v);
  const n = { id, kind:'inbox', source:'capture', from:null, captured:TODAY, raw:v, p:{ kind: guessWait ? 'waiting' : guessSome ? 'someday' : 'action', next:v.replace(/^(todo|remember to|remind me to)\s*/i, ''), owner: guessWait ? 'priya' : undefined, project:null, ctx:'@quick', min:15, conf:.66, why:'Captured just now with no source thread to read, so this is a first guess from the wording alone.' } };
  items.unshift(n); state.captured.push(Object.assign({}, n, { captured:iso(TODAY) })); save();
  $('#captureInput').value = ''; sel = id; location.hash = '#inbox'; toast('Captured · waiting for you in the inbox'); render();
});
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea,select') ) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const v = views.find(x => x.key === e.key); if (v) { location.hash = '#' + v.id; return; }
  if (e.key === '/') { e.preventDefault(); $('#captureInput').focus(); return; }
  if (e.key === '?') { guideDrawer(); return; }
  const cur = location.hash.slice(1) || 'now';
  if (cur === 'inbox') {
    if (e.key === 'j') moveSel(1); else if (e.key === 'k') moveSel(-1);
    else if (e.key === 'a') acceptCurrent(); else if (e.key === 'x') acceptCurrent('done'); else if (e.key === 'w') acceptCurrent('waiting'); else if (e.key === 's') acceptCurrent('someday'); else if (e.key === 't') acceptCurrent('trash');
    else if (e.key === 'e') { e.preventDefault(); $('#pNext')?.focus(); $('#pNext')?.select(); }
    else if (e.key === 'd') { const it = items.find(i => i.id === sel); if (it?.p.ai) { delegateOnAccept = true; acceptCurrent(); } }
  }
});
/* chart tooltips */
const tip = $('#tip');
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 30) + 'px';
});
render();
