<title>Commitment Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f4f5f8; --surface:#ffffff; --surface-2:#eceef3; --raised:#ffffff;
  --ink:#171a21; --ink-2:#565d6b; --ink-3:#8b919e; --line:#dfe2e9; --line-2:#c9cdd6;
  --accent:#3b45a8; --accent-ink:#ffffff; --accent-soft:#e8eafb; --accent-text:#2f388a;
  --good:#1e8a4c; --good-soft:#e3f3e9; --warn:#b8720c; --warn-soft:#fbf0dc; --crit:#c53a3a; --crit-soft:#fbe5e5;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --o1:#86b6ef; --o2:#5598e7; --o3:#2a78d6; --o4:#184f95;
  --shadow:0 12px 32px rgba(23,26,33,.14);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0f1216; --surface:#171b22; --surface-2:#1e232c; --raised:#1c212a;
    --ink:#e7e9ef; --ink-2:#a4aab7; --ink-3:#6f7686; --line:#262b35; --line-2:#333a47;
    --accent:#8e96f0; --accent-ink:#0f1216; --accent-soft:#232848; --accent-text:#b3b9f5;
    --good:#3fb46f; --good-soft:#15291d; --warn:#e09a2b; --warn-soft:#2e2311; --crit:#e5615f; --crit-soft:#331717;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --o1:#9ec5f4; --o2:#6da7ec; --o3:#3987e5; --o4:#256abf;
    --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f1216; --surface:#171b22; --surface-2:#1e232c; --raised:#1c212a;
  --ink:#e7e9ef; --ink-2:#a4aab7; --ink-3:#6f7686; --line:#262b35; --line-2:#333a47;
  --accent:#8e96f0; --accent-ink:#0f1216; --accent-soft:#232848; --accent-text:#b3b9f5;
  --good:#3fb46f; --good-soft:#15291d; --warn:#e09a2b; --warn-soft:#2e2311; --crit:#e5615f; --crit-soft:#331717;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --o1:#9ec5f4; --o2:#6da7ec; --o3:#3987e5; --o4:#256abf;
  --shadow:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2} h2{font-size:17px;line-height:1.3} h3{font-size:14px;line-height:1.3}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px}
.brand .name{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1}
.brand .sub{font-size:11px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .group{padding:12px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-text)}
.nav a .key{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.nav a .cnt{margin-left:auto;min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.nav a.on .cnt{background:var(--accent);color:var(--accent-ink)}
.nav a .cnt.hot{background:var(--crit-soft);color:var(--crit)}
.nav a .cnt.ai{background:var(--accent-soft);color:var(--accent-text)}
.health .ai b{color:var(--accent-text)}
.lab{display:flex;gap:12px;flex:1;min-width:0;cursor:pointer}
.chip.aichip{background:var(--accent-soft);color:var(--accent-text)}
.aican{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
.aican .dlg{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;cursor:pointer}
.effect{font-size:12px;color:var(--ink-2)} .effect b{color:var(--ink);font-weight:500}
.panel.ready{border-color:var(--accent)}
.tile.ai .v{color:var(--accent-text)}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1000px){.lanes{grid-template-columns:1fr}}
.lane{display:flex;flex-direction:column;gap:10px}
.lane .lh{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
.lane .lh h2{font-size:14px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dcard.ready{border-color:var(--accent)}
.dcard.queued{border-style:dashed}
.preview{font-size:12.5px;color:var(--ink-2);white-space:pre-line;max-height:4.2em;overflow:hidden;border-left:2px solid var(--line-2);padding-left:10px}
.pbar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.wstatus{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--ground)}
.wstatus p{margin:0;max-width:78ch;color:var(--ink-2);font-size:13px}
.wlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wlinks a.chip{text-decoration:none;color:var(--accent-text);background:var(--accent-soft)}
.wrow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.wrow:first-of-type{border-top:0}
table.mini td{padding:5px 8px;font-size:12.5px}
.pcard.aicard{border-color:var(--accent)} .pcard.aicard .av{background:var(--accent);color:var(--accent-ink)}
.rail .foot{margin-top:auto;padding:0 8px;font-size:11px;color:var(--ink-3);line-height:1.6}

main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.capture{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 12px}
.capture:focus-within{border-color:var(--accent)}
.capture input{flex:1;border:0;background:transparent;outline:0;min-width:0}
.capture .hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.health{display:flex;gap:18px;margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.health b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.health .bad b{color:var(--crit)}
.date{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}

.view{padding:24px 28px 60px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vhead p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel > .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel > .ph h2{font-size:15px}
.panel .pb{padding:6px 0}
.row{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t .m{font-size:12px;color:var(--ink-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.row.done .t{text-decoration:line-through;color:var(--ink-3)}
.chk{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:4px;margin-top:3px;flex:none;display:grid;place-items:center;background:var(--surface)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:8px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ctx{font-family:var(--mono);font-size:11px}
.chip.proj{color:var(--accent-text);background:var(--accent-soft)}
.chip.src{background:transparent;border:1px solid var(--line);color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.age{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.age.over{color:var(--crit);font-weight:500}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--accent-soft)}
.kbd{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;color:var(--ink-2);line-height:16px;background:var(--surface)}

.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12.5px;color:var(--ink-2)}
.tile.crit{border-color:var(--crit);border-width:1px}
.tile.crit .v{color:var(--crit)}
.tile.warn .v{color:var(--warn)}
.tile .spark{margin-top:6px;height:26px}

.agenda{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start}
.slot:last-child{border-bottom:0}
.slot .tm{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-top:2px;font-variant-numeric:tabular-nums}
.slot.now .tm{color:var(--accent-text);font-weight:500}
.slot .who{font-size:12px;color:var(--ink-2);margin-top:2px}
.ctxgroup{padding:10px 16px 4px;display:flex;align-items:center;gap:8px}
.ctxgroup .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

.inbox{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
@media (max-width:1000px){.inbox{grid-template-columns:1fr}}
.ilist .row{cursor:pointer;gap:10px}
.ilist .row:hover{background:var(--surface-2)}
.ilist .row.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ilist .raw{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilist .row.sel .raw{white-space:normal}
.conf{width:36px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:none;margin-top:8px}
.conf i{display:block;height:100%;background:var(--good)}
.conf.low i{background:var(--warn)}
.detail{position:sticky;top:78px}
.detail .src{padding:14px 18px;border-bottom:1px solid var(--line)}
.detail .src .raw{font-size:15px;line-height:1.5;margin-top:6px}
.detail .prop{padding:14px 18px;display:grid;grid-template-columns:110px 1fr;gap:10px 14px;align-items:center}
.detail .prop label{font-size:12px;color:var(--ink-2);font-weight:500}
.detail .prop input,.detail .prop select{width:100%;border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:6px 9px}
.detail .prop input:focus,.detail .prop select:focus{border-color:var(--accent);outline:0}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:12px;font-weight:500;color:var(--ink-2)}
.kinds button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.rationale{padding:0 18px 14px;font-size:12.5px;color:var(--ink-2)}
.rationale .why{background:var(--ground);border-radius:7px;padding:9px 12px;border-left:3px solid var(--line-2)}
.rationale .why.low{border-left-color:var(--warn)}
.acts{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.acts .sp{flex:1}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:4px}

.prog{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prog .head{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.prog .head .purpose{color:var(--ink-2);font-size:13px;flex:1;min-width:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:8px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.flag{font-size:11.5px;font-weight:600;color:var(--crit)}
.tablewrap{overflow-x:auto}
.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:500;text-align:left;cursor:pointer}
.linkish:hover{color:var(--accent-text);text-decoration:underline}
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hist li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.drawer .sec p{max-width:60ch}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:500;color:var(--ink-2)}
.in{width:100%;border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:8px 10px;font:inherit;resize:vertical}
.in:focus{border-color:var(--accent);outline:0}

.aging{display:flex;flex-direction:column;gap:6px;padding:14px 18px}
.aging .bar{display:grid;grid-template-columns:70px 1fr 28px;align-items:center;gap:10px;font-size:12.5px}
.aging .bar .lbl{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.aging .bar .trk{height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.aging .bar .trk i{display:block;height:100%;border-radius:0 4px 4px 0}
.aging .bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.person-h{display:flex;align-items:center;gap:10px;padding:12px 18px 6px}
.person-h .av{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:11px;font-weight:600;font-family:var(--mono)}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pcard .top{display:flex;align-items:center;gap:10px}
.pcard .av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-size:12px;font-weight:600;font-family:var(--mono)}
.pcard .role{font-size:12px;color:var(--ink-2)}
.pcard .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px}
.pcard .two .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:4px}
.pcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.pcard li{color:var(--ink-2);line-height:1.35}
.pcard li.over{color:var(--crit)}
.pcard .foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:auto}

.steps{display:flex;flex-direction:column;gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.step .sh{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.step .sh .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:18px}
.step .sh h3{flex:1}
.step .sh .st{font-size:12px;color:var(--ink-2)}
.step.ok .sh h3{color:var(--ink-3)}
.step .sb{border-top:1px solid var(--line)}
.step .sb .row{padding:8px 16px}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}

.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.grid line{stroke:var(--line);stroke-width:1}
.axis line{stroke:var(--line-2)}
.tip{position:fixed;pointer-events:none;background:var(--raised);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:7px;padding:6px 10px;font-size:12px;z-index:50;display:none;white-space:nowrap}
.tip b{font-weight:600}

.drawer-bg{position:fixed;inset:0;background:rgba(15,18,22,.35);z-index:20;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:none;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open,.drawer-bg.open{display:flex}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .db{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer .df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.drawer .sec h3{margin-bottom:6px}

const pname = (id) => person(id)?.name.split(' ')[0] ?? '—';
const initials = (id) => person(id)?.name.split(' ').map(s => s[0]).join('') ?? '·';
const projOf = (id) => projects.find(p => p.id === id) || programs.find(p => p.id === id);
const projName = (id) => projOf(id)?.name ?? '—';
const fmtDate = (x) => new Date(x).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
const dueLabel = (x) => { const u = until(x); return u < 0 ? `${-u}d overdue` : u === 0 ? 'today' : u === 1 ? 'tomorrow' : fmtDate(x); };
const healthPill = (h) => ({ good:'<span class="pill good"><i></i>On track</span>', warn:'<span class="pill warn"><i></i>At risk</span>', crit:'<span class="pill crit"><i></i>Blocked</span>' })[h];
const srcLabel = { email:'Email', chat:'Chat', meeting:'Meeting note', voice:'Voice', calendar:'Calendar', capture:'Captured' };
const by = (k) => items.filter(i => i.kind === k);
const mine = () => items.filter(i => i.kind === 'action' && i.owner !== 'ai');
const mine_ = mine;
const delegated = (st) => items.filter(i => i.owner === 'ai' && i.del && (st ? i.del.status === st : i.kind === 'action'));
function openActions(pid) { return mine().filter(i => i.project === pid); }
function delegatedFor(pid) { return delegated().find(i => i.project === pid) || null; }
function nextActionFor(pid) { const open = openActions(pid); return open.find(a => a.id === state.primary[pid]) || open[0] || null; }
function waitingFor(pid) { return items.find(i => i.kind === 'waiting' && i.project === pid) || null; }
function isPrimary(a) { return a.project && nextActionFor(a.project)?.id === a.id && openActions(a.project).length > 1; }
/* Activity is derived from the ledger, never typed in: an action being accepted, a waiting-for opening, a nudge going out, an item being done. */
function activity(pid) {
  const ev = [];
  for (const i of items) {
    if (i.project !== pid) continue;
    if (i.createdAt) ev.push({ when:new Date(i.createdAt), what:'Next action added', item:i });
    if (i.kind === 'waiting' && i.since) ev.push({ when:new Date(i.since), what:`Waiting on ${pname(i.owner)}`, item:i });
    if (i.lastNudged) ev.push({ when:new Date(i.lastNudged), what:`Nudged ${pname(i.owner)}`, item:i });
    if (i.kind === 'done' && i.doneAt) ev.push({ when:new Date(i.doneAt), what: i.del ? 'Approved AI work' : 'Done', item:i });
    if (i.del?.at) ev.push({ when:new Date(i.del.at), what:'Handed to AI', item:i });
    if (i.del?.readyAt) ev.push({ when:new Date(i.del.readyAt), what:'AI delivered', item:i });
  }
  return ev.sort((a, b) => b.when - a.when);
}
function lastMovement(pid) { return activity(pid)[0] || null; }
function projHealth(p) { const na = nextActionFor(p.id), w = waitingFor(p.id), dl = delegatedFor(p.id), lm = lastMovement(p.id); return { na, w, dl, lm, age: lm ? days(lm.when) : null, stalled: !lm || days(lm.when) > 7, noNext: !na && !w && !dl }; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- nav & health ---------- */
const views = [
  { id:'now', label:'Now', key:'1' },
  { id:'inbox', label:'Inbox', key:'2', count:() => by('inbox').length, hot:true },
  { id:'programs', label:'Programs', key:'3', count:() => projects.filter(p => projHealth(p).noNext).length, hot:true },
  { id:'waiting', label:'Waiting for', key:'4', count:() => by('waiting').filter(w => until(w.followUp) < 0).length, hot:true },
  { id:'delegated', label:'Delegated to AI', key:'5', count:() => delegated('ready').length, ai:true },
  { id:'people', label:'People', key:'6' },
  { id:'review', label:'Weekly review', key:'7' },
  { id:'flow', label:'Flow', key:'8' },
];
function renderNav() {
  const cur = location.hash.slice(1) || 'now';
  $('#nav').innerHTML = `<div class="group">Engage</div>` + views.slice(0, 1).map(v => navLink(v, cur)).join('') +
    `<div class="group">Lists</div>` + views.slice(1, 6).map(v => navLink(v, cur)).join('') +
    `<div class="group">Reflect</div>` + views.slice(6).map(v => navLink(v, cur)).join('');
  const inbox = by('inbox').length, over = by('waiting').filter(w => until(w.followUp) < 0).length, noNext = projects.filter(p => projHealth(p).noNext).length, lr = days(state.lastReview);
  $('#healthbar').innerHTML = `<span class="${inbox ? 'bad' : ''}">Inbox <b>${inbox}</b></span><span class="${over ? 'bad' : ''}">Overdue waiting <b>${over}</b></span><span class="${noNext ? 'bad' : ''}">No next action <b>${noNext}</b></span><span class="${lr > 7 ? 'bad' : ''}">Last review <b>${lr}d</b></span><span class="ai">AI for review <b>${delegated('ready').length}</b></span>`;
}
function navLink(v, cur) {
  const n = v.count ? v.count() : 0;
  return `<a href="#${v.id}" class="${cur === v.id ? 'on' : ''}">${v.label}${n ? `<span class="cnt ${v.hot ? 'hot' : ''}${v.ai ? ' ai' : ''}">${n}</span>` : `<span class="key">${v.key}</span>`}</a>`;
}

function readyRow(x) {

function waitingRow(w, opts = {}) {

}

/* ---------- views ---------- */

  const noNext = projects.filter(p => projHealth(p).noNext);
  const groups = {};
  for (const a of actions) (groups[a.ctx] ||= []).push(a);
  const order = ['@quick', '@deep', '@1:1/priya', '@1:1/leo', '@agenda/steering'];
  const keys = Object.keys(groups).sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));

  return `<div class="vhead"><div><h1>Monday, 14 September</h1><p>${free}. Deep-work items fit the morning block; the two quick reviews fit before the 1:1.</p></div><div class="shortcuts"><span><span class="kbd">j</span>/<span class="kbd">k</span> move</span><span><span class="kbd">x</span> done</span></div></div>
  <div class="attn">
    <div class="tile ${by('inbox').length ? 'warn' : ''}"><div class="v">${by('inbox').length}</div><div class="l">in the inbox to clarify</div></div>
    <div class="tile ${over.length ? 'crit' : ''}"><div class="v">${over.length}</div><div class="l">waiting-fors past follow-up</div></div>
    <div class="tile ${dueSoon.length ? 'warn' : ''}"><div class="v">${dueSoon.length}</div><div class="l">actions due by tomorrow</div></div>

  <div class="cols">
    <div class="panel"><div class="ph"><h2>Today</h2><span class="note">Prep briefs pull related projects, open items and decisions</span></div>
      <div class="agenda">${meetings.map((m, i) => `<div class="slot ${i === 0 ? 'now' : ''}"><div class="tm">${m.time}</div><div><div>${esc(m.title)}</div><div class="who">${m.who.map(pname).join(', ')} · ${m.dur} min</div></div><button class="btn sm" data-prep="${i}">Prep</button></div>`).join('')}</div>
    </div>
    <div class="panel"><div class="ph"><h2>Next actions by context</h2><span class="note num">${actions.length} open · ${delegated().length} with AI</span></div>
      <div class="pb">${keys.map(k => `<div class="ctxgroup"><span class="chip ctx">${esc(k)}</span><span class="n">${groups[k].length}</span></div>${groups[k].map(actionRow).join('')}`).join('')}</div>
    </div>

}

function viewWaiting() {
  const ws = by('waiting');
  const buckets = [['0–7 d', w => days(w.since) <= 7, 'var(--o1)'], ['8–14 d', w => days(w.since) > 7 && days(w.since) <= 14, 'var(--o2)'], ['15–30 d', w => days(w.since) > 14 && days(w.since) <= 30, 'var(--o3)'], ['30+ d', w => days(w.since) > 30, 'var(--o4)']];
  const max = Math.max(1, ...buckets.map(b => ws.filter(b[1]).length));
  const byPerson = {};
  for (const w of ws) (byPerson[w.owner] ||= []).push(w);
  const ppl = Object.keys(byPerson).sort((a, b) => Math.max(...byPerson[b].map(w => days(w.since))) - Math.max(...byPerson[a].map(w => days(w.since))));
  return `<div class="vhead"><div><h1>Waiting for</h1><p>The ledger of what's owed to you. Aged like receivables; nudges are drafted by AI and sent only when you approve.</p></div></div>
  <div class="cols">
    <div class="panel"><div class="ph"><h2>Aging</h2><span class="note num">${ws.length} open · ${ws.filter(w => until(w.followUp) < 0).length} past follow-up</span></div>
      <div class="aging">${buckets.map(b => { const n = ws.filter(b[1]).length; return `<div class="bar"><span class="lbl">${b[0]}</span><div class="trk"><i style="width:${n / max * 100}%;background:${b[2]}"></i></div><span class="n">${n}</span></div>`; }).join('')}</div>
      <div class="ph" style="border-top:1px solid var(--line);border-bottom:0"><h2>Oldest</h2></div>
      <div class="pb">${[...ws].sort((a, b) => days(b.since) - days(a.since)).slice(0, 3).map(w => `<div class="row"><div class="t"><div>${esc(w.next)}</div><div class="m"><span class="chip">${esc(pname(w.owner))}</span><span class="age over">${days(w.since)}d</span></div></div></div>`).join('')}</div>
    </div>
    <div class="panel"><div class="ph"><h2>By person</h2><span class="note">Sorted by oldest item</span></div>
      <div class="pb">${ppl.map(pid => `<div class="person-h"><span class="av">${initials(pid)}</span><b>${esc(person(pid).name)}</b><span class="note">${esc(person(pid).role)}</span></div>${byPerson[pid].map(w => waitingRow(w)).join('')}`).join('')}</div>
    </div>
  </div>`;
}

function viewFlow() {
  const W = 720, H = 220, padL = 32, padB = 26, padT = 10, gw = (W - padL - 8) / flowWeeks.length, bw = Math.floor((gw - 14) / 3), maxV = 45;
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);
  const series = [['c', 'Captured', 'var(--s1)'], ['k', 'Clarified', 'var(--s2)'], ['d', 'Done', 'var(--s3)']];
  const bars = flowWeeks.map((wk, i) => series.map((s, j) => { const x = padL + i * gw + 7 + j * (bw + 2), h = H - padB - y(wk[s[0]]);
    return `<rect x="${x}" y="${y(wk[s[0]])}" width="${bw}" height="${h}" rx="3" fill="${s[2]}" data-tip="<b>${s[1]}</b> · week of ${wk.w}: ${wk[s[0]]}"></rect>`; }).join('')).join('');

    <div class="tile"><div class="v">${((delegated().reduce((n, i) => n + (i.del.minutes || 0), 0) + 130) / 60).toFixed(1)}<span class="muted" style="font-size:14px"> h</span></div><div class="l">handed to AI this week</div></div>
  </div>
  <div class="chartbox"><h2 style="font-size:15px">Items per week</h2><div class="legend">${series.map(s => `<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:8px" role="img" aria-label="Grouped bars of captured, clarified and done items per week for eight weeks"><g class="grid">${ticks}</g>${bars}<g>${labels}</g></svg></div>

    ${x.del.status === 'ready' && x.del.deliverable ? `<div class="preview">${esc(x.del.deliverable)}</div>` : ''}
    <div class="effect">On approval: <b>${esc(x.del.effect)}</b></div>
    <div style="display:flex;gap:6px;margin-top:2px">${x.del.status === 'ready' ? `<button class="btn sm primary" data-review="${x.id}">Review</button>` : ''}<button class="btn sm ghost" data-takeback="${x.id}">Take it back</button></div></div>`;
  const lane = (title, list, hint) => `<div class="lane"><div class="lh"><h2>${title}</h2><span class="note num">${list.length}</span></div>${list.map(card).join('') || `<div class="empty" style="padding:22px 12px">${hint}</div>`}</div>`;
  const opts = (cap) => (cap === 'send' || cap === 'calendar' || cap === 'delete') ? ['never', 'ask'] : ['never', 'ask', 'draft', 'auto'];
  return `<div class="vhead"><div><h1>Delegated to AI</h1><p>Handing work to the assistant is GTD delegation with a faster clock and a review gate. It works from the ledger and the source thread; anything with a side effect waits for your approval.</p></div><div class="shortcuts"><span>From any action: <b>Hand to AI</b></span><span>From the inbox: <span class="kbd">d</span> then <span class="kbd">a</span></span></div></div>
  <div class="attn">
    <div class="tile ${r.length ? 'ai' : ''}"><div class="v">${r.length}</div><div class="l">ready for your review</div></div>
    <div class="tile"><div class="v">${w.length + q.length}</div><div class="l">in progress or queued</div></div>
    <div class="tile"><div class="v">${approved}</div><div class="l">approved this week</div></div>
    <div class="tile"><div class="v">${hours}<span class="muted" style="font-size:14px"> h</span></div><div class="l">of your time handed off this week</div></div>
  </div>
  <div class="lanes">${lane('Queued', q, 'Nothing queued')}${lane('Working', w, 'Idle')}${lane('Ready for review', r, 'Nothing waiting on you')}</div>
  <div class="cols">
    <div class="panel"><div class="ph"><h2>Autonomy</h2><span class="note">What the assistant may do without asking</span></div>
      <div class="tablewrap"><table><tbody>${Object.keys(capLabel).filter(c => c !== 'clarify').map(c => `<tr><td>${esc(capLabel[c])}</td><td style="width:210px"><select class="in" data-autonomy="${c}">${opts(c).map(o => `<option value="${o}" ${(state.autonomy[c] || 'ask') === o ? 'selected' : ''}>${autonomyLabel[o]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
      <div class="note" style="padding:10px 18px">Sending, booking and deleting can never go above "Always ask first". Everything the assistant does — including at "Do it" — is logged and shows up in the weekly review.</div>
    </div>
    <div class="panel"><div class="ph"><h2>This week's log</h2><span class="note">Every AI action, asked or automatic</span></div>
      <div class="pb">${aiLog.map(l => `<div class="row"><div class="t"><div>${esc(l.what)}</div><div class="m"><span class="chip">${esc(capLabel[l.cap] || l.cap)}</span><span class="chip ${l.mode === 'auto' ? 'aichip' : ''}">${l.mode === 'auto' ? 'automatic' : 'you approved'}</span><span class="faint">${fmtDate(l.at)}</span></div></div></div>`).join('')}</div>
    </div>
  </div>`;
}
function wikiDrawer(pid) {
  const g = programs.find(x => x.id === pid), w = wiki[pid]; if (!w) return;
  const st = (x) => ({ done:'good', 'on track':'good', locked:'good', 'at risk':'warn', 'room clash':'warn', 'pending window':'warn', blocked:'crit', undecided:'crit' })[x] || 'neutral';
  openDrawer(esc(g.name), `
    <div class="sec"><div class="eyebrow">wiki/${esc(w.page)}.md · living doc · compiled ${fmtDate(w.compiled)}</div></div>
    <div class="sec"><h3>Purpose</h3><p class="muted" style="margin:0">${esc(g.purpose)}</p></div>
    <div class="sec"><h3>Key links</h3><div class="wlinks">${w.links.map(l => l[1] ? `<a class="chip" href="${l[1]}">${esc(l[0])}</a>` : `<span class="chip">${esc(l[0])}</span>`).join('')}</div></div>
    <div class="sec"><h3>Current status <span class="faint" style="font-weight:400">· compiled</span></h3><p class="muted" style="margin:0">${healthPill(w.health)} ${esc(w.status)}</p></div>
    <div class="sec"><h3>Milestones</h3><div class="tablewrap"><table class="mini"><tbody>${w.milestones.map(m => `<tr><td class="mono num">${esc(m[0])}</td><td>${esc(m[1])}</td><td><span class="pill ${st(m[2])}"><i></i>${esc(m[2])}</span></td></tr>`).join('')}</tbody></table></div></div>
    <div class="sec"><h3>Decisions</h3>${w.decisions.map(x => `<div class="wrow"><span class="mono num faint">${x.on}</span><div><b>${esc(x.what)}</b> <span class="faint">· ${esc(x.who)}</span><div class="muted">${esc(x.why)}</div>${x.status !== 'decided' ? `<span class="pill warn" style="margin-top:4px"><i></i>${esc(x.status)}</span>` : ''}</div></div>`).join('')}${w.pending.length ? `<div class="wrow"><span class="eyebrow">Pending</span><ul style="margin:0">${w.pending.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}</div>
    <div class="sec"><h3>Risks</h3><ul>${w.risks.map(r => `<li><span class="pill ${r.level === 'high' ? 'crit' : r.level === 'medium' ? 'warn' : 'neutral'}"><i></i>${r.level}</span> ${esc(r.what)} <span class="faint">· ${r.owner ? esc(pname(r.owner)) : 'no owner'}</span></li>`).join('')}</ul></div>
    <div class="note">Compiled sections are rewritten from the ledger; purpose, links, decisions and risks are written by you or by reviewed ingests. Full page and history in the repo.</div>`,
    `<button class="btn" data-close>Close</button><button class="btn primary" data-ingest="${pid}">Ingest notes into this page</button>`);
}
function statusDraft() {
  const done = by('done');
  const text = programs.map(g => { const js = projects.filter(j => j.program === g.id); const h = js.some(j => j.health === 'crit') ? 'Blocked' : js.some(j => j.health === 'warn') ? 'At risk' : 'On track';
    const wins = done.filter(x => js.some(j => j.id === x.project) || x.project === g.id).map(x => `  • ${x.next}`).join('\n');
    const risks = js.filter(j => j.health !== 'good').map(j => { const s = projHealth(j); return `  • ${j.name}: ${s.w ? `waiting on ${pname(s.w.owner)} for ${days(s.w.since)}d` : s.noNext ? 'no next action defined' : 'at risk'}`; }).join('\n');
    return `${g.name} — ${h}\nDone this week:\n${wins || '  • —'}\nRisks / asks:\n${risks || '  • none'}`; }).join('\n\n');
  openDrawer('Status report · week of 7 Sep', `<textarea class="draft" style="min-height:360px">${esc(text)}</textarea><div class="note">Assembled from health, wins and waiting-fors. Edit, then paste wherever status lives.</div>`, `<button class="btn" data-close>Close</button><button class="btn primary" data-copy>Copy</button>`);
}

/* ---------- render & events ---------- */
function render() {
  const cur = location.hash.slice(1) || 'now';
  const v = { now:viewNow, inbox:viewInbox, programs:viewPrograms, waiting:viewWaiting, delegated:viewDelegated, people:viewPeople, review:viewReview, flow:viewFlow }[cur] || viewNow;
  $('#view').innerHTML = v();
  renderNav();
  window.scrollTo({ top:0 });
}
window.addEventListener('hashchange', render);

function acceptCurrent(overrideKind) {
  const it = items.find(i => i.id === sel); if (!it) return;
  const kind = overrideKind || it.p.kind;
  const next = $('#pNext')?.value.trim() || it.p.next;
  if (kind === 'trash') { it.kind = 'trash'; state.kinds[it.id] = 'trash'; }
  else {
    it.next = next; it.project = $('#pProj')?.value || it.p.project || null;
    if (kind === 'action' || kind === 'project') { it.ctx = $('#pCtx')?.value || it.p.ctx || '@quick'; it.min = +($('#pMin')?.value) || it.p.min; const dv = $('#pDue')?.value; it.due = dv ? new Date(dv + 'T08:00:00') : it.p.due; }
    if (kind === 'waiting') { it.owner = $('#pOwner')?.value || it.p.owner || it.from; it.since = TODAY; const fv = $('#pFollow')?.value; it.followUp = fv ? new Date(fv + 'T08:00:00') : d(3); it.nudges = 0; }
    if (kind === 'someday') it.since = TODAY;
    if (kind === 'action' || kind === 'project') it.createdAt = TODAY;
    if (delegateOnAccept && it.p.ai && (kind === 'action' || kind === 'project')) handOff(it, it.p.ai.cap, it.p.ai.what);
    it.kind = kind === 'project' ? 'action' : kind;
    state.kinds[it.id] = it.kind; state.overrides[it.id] = { next:it.next, project:it.project, ctx:it.ctx, min:it.min, due:it.due, owner:it.owner, since:it.since, followUp:it.followUp, nudges:it.nudges, createdAt:it.createdAt };
  }
  save();
  const labels = { action:'Filed as next action', waiting:'Filed as waiting for', project:'New project created with first action', someday:'Parked in someday / maybe', reference:'Filed as reference', trash:'Trashed' };
  toast((it.owner === 'ai' ? 'Filed and handed to AI' : labels[kind]) + ' · tagged ai-filed, confirmed by you');
  delegateOnAccept = false;
  const rest = by('inbox'); sel = rest[0]?.id ?? null; render();
}
function moveSel(dir) { const inbox = by('inbox'); const i = inbox.findIndex(x => x.id === sel); sel = inbox[Math.max(0, Math.min(inbox.length - 1, i + dir))]?.id ?? sel; render(); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-sel],[data-kind],[data-accept],[data-skip],[data-draft],[data-prep],[data-nudge],[data-agenda],[data-close],[data-send],[data-proj],[data-wiki],[data-ingest],[data-hand],[data-review],[data-approve],[data-takeback],[data-addproj],[data-saveproj],[data-primary],[data-addnext],[data-promote],[data-drop],[data-status],[data-complete],[data-copy],[data-reset]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.sel) { sel = ds.sel; render(); }
  else if (ds.kind) { const it = items.find(i => i.id === sel); it.p.kind = ds.kind; if (ds.kind === 'waiting' && !it.p.owner) it.p.owner = it.from || 'priya'; render(); }
  else if ('accept' in ds) acceptCurrent();
  else if ('skip' in ds) moveSel(1);
  else if ('draft' in ds) { const it = items.find(i => i.id === sel); openDrawer('Reply draft', `<textarea class="draft">Hi ${esc(pname(it.from) || 'there')},\n\nThanks — got it. ${it.p.kind === 'action' ? `I'll have this to you ${it.p.due ? 'by ' + fmtDate(it.p.due) : 'shortly'}.` : 'I\'ll follow up once I have what I need.'}\n\nJeff</textarea><div class="note">Two-minute rule: if the AI can do it, it drafts it. You still press send.</div>`, `<button class="btn" data-close>Discard</button><button class="btn primary" data-close>Approve and send</button>`); }
  else if (ds.prep) prepBrief(+ds.prep);
  else if (ds.nudge) nudgeDraft(ds.nudge);
  else if (ds.agenda) agendaDrawer(ds.agenda);
  else if ('close' in ds) closeDrawer();
  else if (ds.send) { state.nudged[ds.send] = (state.nudged[ds.send] || 0) + 1; const w = items.find(i => i.id === ds.send); w.nudges = (w.nudges || 0) + 1; w.followUp = d(5); w.lastNudged = TODAY; save(); closeDrawer(); toast(`Nudge sent to ${pname(w.owner)} · follow-up moved to ${fmtDate(w.followUp)}`); render(); }
  else if (ds.proj) projectDrawer(ds.proj);
  else if (ds.wiki) wikiDrawer(ds.wiki);
  else if (ds.ingest) { const g = programs.find(x => x.id === ds.ingest); const id = 'N' + Date.now(); const a = { id, kind:'action', next:`Ingest this week's notes into ${g.name} wiki pages`, project:g.id, ctx:'@ai', min:30, createdAt:TODAY, ai:{ level:'do', cap:'wiki', what:'Read the notes, update hub sections and decisions, append to timeline and log' } }; items.push(a); state.captured.push(Object.assign({}, a, { createdAt:iso(TODAY) })); handOff(a, 'wiki', a.ai.what); a.del.effect = `Updates ${wiki[g.id].page}.md and -decisions.md; appends to log.md`; state.delegated[id].effect = a.del.effect; save(); closeDrawer(); toast('Handed to AI · wiki ingest queued for your review'); location.hash = '#delegated'; render(); }
  else if (ds.hand) { const a = items.find(i => i.id === ds.hand); handOff(a, a.ai?.cap, a.ai?.what); toast(`Handed to AI · "${a.next}" — you'll be asked before anything is sent`); render(); }
  else if (ds.review) reviewDrawer(ds.review);
  else if (ds.approve) { const x = items.find(i => i.id === ds.approve); const txt = $('#rvText')?.value; if (txt) x.del.deliverable = txt; x.del.status = 'approved'; x.kind = 'done'; x.doneAt = TODAY; state.delegated[x.id] = Object.assign(state.delegated[x.id] || {}, { status:'approved', deliverable:x.del.deliverable, at:iso(x.del.at), readyAt:iso(x.del.readyAt || TODAY) }); state.done[x.id] = true; save(); closeDrawer(); toast(`Approved · ${x.del.effect}`); render(); }
  else if (ds.takeback) { const x = items.find(i => i.id === ds.takeback); delete x.owner; delete x.del; if (!x.ctx) x.ctx = '@quick'; state.delegated[x.id] = { status:'taken' }; save(); closeDrawer(); toast(`Taken back · "${x.next}" is on your list again`); render(); }
  else if (ds.addproj) addProjectDrawer(ds.addproj);
  else if (ds.saveproj) {
    const name = $('#npName').value.trim(), outcome = $('#npOutcome').value.trim(), next = $('#npNext').value.trim(), err = $('#npErr');
    if (!name) { err.textContent = 'Give the project a name.'; $('#npName').focus(); return; }
    if (!outcome) { err.textContent = 'Write the outcome — one sentence you could check against.'; $('#npOutcome').focus(); return; }
    const id = 'JN' + Date.now();
    const j = { id, program:ds.saveproj, name, outcome, health:$('#npHealth').value, suggest:'Book 20 minutes with the owner to agree the next step' };
    projects.push(j); state.projects.push(j);
    if (next) { const aid = 'N' + Date.now(); const a = { id:aid, kind:'action', next, project:id, ctx:$('#npCtx').value, min:30, createdAt:TODAY }; items.push(a); state.captured.push(Object.assign({}, a, { createdAt:iso(TODAY) })); state.primary[id] = aid; }
    save(); closeDrawer(); toast(next ? `Project created with its first action` : `Project created — decide its next action`); render();
  }
  else if (ds.primary) { const a = items.find(i => i.id === ds.primary); state.primary[a.project] = a.id; save(); toast('Marked as the next action for ' + projName(a.project)); projectDrawer(a.project); render(); }
  else if (ds.addnext) { const j = projOf(ds.addnext); const next = $('#suggestText')?.value.trim(); if (!next) { $('#suggestErr').textContent = 'Write the next physical action first.'; return; } const id = 'N' + Date.now(); const n = { id, kind:'action', next, project:j.id, ctx:$('#suggestCtx')?.value || '@deep', min:30, createdAt:TODAY }; items.push(n); state.captured.push(Object.assign({}, n, { createdAt:iso(TODAY) })); state.primary[j.id] = id; save(); toast('Next action added · tagged ai-suggested, confirmed by you'); projectDrawer(j.id); render(); }
  else if (ds.promote) { const s = items.find(i => i.id === ds.promote); s.kind = 'action'; s.ctx = '@deep'; s.min = 30; s.createdAt = TODAY; state.kinds[s.id] = 'action'; state.overrides[s.id] = { ctx:'@deep', min:30, createdAt:TODAY }; save(); toast('Promoted to next action'); render(); }
  else if (ds.drop) { const s = items.find(i => i.id === ds.drop); s.kind = 'trash'; state.kinds[s.id] = 'trash'; save(); toast('Dropped'); render(); }
  else if ('status' in ds) statusDraft();
  else if ('complete' in ds) { state.lastReview = iso(TODAY); state.review = {}; save(); toast('Weekly review completed · every project stamped'); render(); }
  else if ('copy' in ds) { const ta = $('#drawer textarea'); ta?.select(); try { navigator.clipboard?.writeText(ta.value); } catch (x) {} toast('Copied'); }
  else if ('reset' in ds) { try { localStorage.removeItem(STORE); } catch (x) {} location.reload(); }
});
document.addEventListener('input', (e) => { if (e.target.closest('.form')) { const er = $('#npErr'); if (er) er.textContent = ''; } });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.done) { const it = items.find(i => i.id === t.dataset.done); if (t.checked) { it._prev = it.kind; it.kind = 'done'; it.doneAt = TODAY; state.done[it.id] = true; state.overrides[it.id] = Object.assign(state.overrides[it.id] || {}, { doneAt:TODAY }); toast('Done · logged for the weekly review'); } else { it.kind = it._prev || 'action'; delete state.done[it.id]; } save(); renderNav(); }
  if (t.dataset.step) { state.review[t.dataset.step] = t.checked; save(); render(); }
  if (t.dataset.autonomy) { state.autonomy[t.dataset.autonomy] = t.value; save(); toast(`${capLabel[t.dataset.autonomy]}: ${autonomyLabel[t.value]}`); }
  if ('delegate' in t.dataset) { delegateOnAccept = t.checked; render(); }
});
$('#drawerBg').addEventListener('click', closeDrawer);
$('#captureForm').addEventListener('submit', (e) => {
  e.preventDefault(); const v = $('#captureInput').value.trim(); if (!v) return;
  const id = 'C' + Date.now();
  const guessWait = /waiting|will send|said (he|she|they)|promised|get back/i.test(v), guessSome = /idea|someday|maybe|could/i.test(v);
  const n = { id, kind:'inbox', source:'capture', from:null, captured:TODAY, raw:v, p:{ kind: guessWait ? 'waiting' : guessSome ? 'someday' : 'action', next:v.replace(/^(todo|remember to|remind me to)\s*/i, ''), owner: guessWait ? 'priya' : undefined, project:null, ctx:'@quick', min:15, conf:.66, why:'Captured just now with no source thread to read, so this is a first guess from the wording alone.' } };
  items.unshift(n); state.captured.push(Object.assign({}, n, { captured:iso(TODAY) })); save();
  $('#captureInput').value = ''; sel = id; location.hash = '#inbox'; toast('Captured · waiting for you in the inbox'); render();
});
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea,select') ) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const v = views.find(x => x.key === e.key); if (v) { location.hash = '#' + v.id; return; }
  if (e.key === '/') { e.preventDefault(); $('#captureInput').focus(); return; }
  if (e.key === '?') { openDrawer('Shortcuts', `<ul><li><span class="kbd">1</span>–<span class="kbd">8</span> switch view</li><li><span class="kbd">/</span> capture</li><li><span class="kbd">j</span> / <span class="kbd">k</span> move selection</li><li><span class="kbd">a</span> accept proposal · <span class="kbd">w</span> as waiting-for · <span class="kbd">s</span> someday · <span class="kbd">t</span> trash · <span class="kbd">e</span> edit next action</li><li><span class="kbd">d</span> toggle hand-to-AI on accept</li><li><span class="kbd">x</span> mark the focused action done</li><li><span class="kbd">Esc</span> close</li></ul>`); return; }
  const cur = location.hash.slice(1) || 'now';
  if (cur === 'inbox') {
    if (e.key === 'j') moveSel(1); else if (e.key === 'k') moveSel(-1);
    else if (e.key === 'a') acceptCurrent(); else if (e.key === 'w') acceptCurrent('waiting'); else if (e.key === 's') acceptCurrent('someday'); else if (e.key === 't') acceptCurrent('trash');
    else if (e.key === 'e') { e.preventDefault(); $('#pNext')?.focus(); $('#pNext')?.select(); }
    else if (e.key === 'd') { const it = items.find(i => i.id === sel); if (it?.p.ai) { delegateOnAccept = !delegateOnAccept; render(); } }
  }
});
/* chart tooltips */
const tip = $('#tip');
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 30) + 'px';
});
render();
</script>
